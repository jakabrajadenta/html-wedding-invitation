<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6f0b0f">
  <title>Undangan Pernikahan</title>
  <meta name="description" content="Undangan pernikahan online.">
  <meta property="og:title" content="Undangan Pernikahan">
  <meta property="og:description" content="Dengan penuh syukur, kami mengundang Anda untuk hadir dan berbagi doa.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%236f0b0f'/%3E%3Crect x='4' y='4' width='24' height='24' fill='none' stroke='%23dfc186'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23dfc186'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Marcellus&family=Allura&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="is-locked">
  <svg width="0" height="0" class="svg-defs" aria-hidden="true">
    <defs>
      <g id="bloom">
        <path d="M0 0C-14-14-16-36-6-50C-3-40 0-34 0-26C2-34 6-42 13-50C20-32 15-12 0 0Z"/>
        <path d="M-5-5C-26-8-41-22-44-40C-31-38-19-31-12-20"/>
        <path d="M5-5C25-9 38-22 41-38C29-37 18-31 11-20"/>
        <path d="M0-6V-24M-4-8L-8-22M4-8L8-22"/>
      </g>
      <g id="bud">
        <path d="M0 0C-9-8-9-21 0-30C9-21 9-8 0 0Z"/>
        <path d="M0 0C-5-9-5-15-2-22M-7-6C-13-8-15-12-16-16M7-6C13-8 15-12 16-16"/>
      </g>
      <g id="leaf">
        <path d="M0 0C8-16 26-24 42-22C38-6 20 6 0 0Z"/>
        <path d="M0 0C12-6 24-13 34-18"/>
      </g>
    </defs>
    <symbol id="floral" viewBox="0 0 240 280">
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 14C28 62 62 92 118 104C150 111 176 109 204 96"/>
        <path d="M34 62C26 104 30 146 12 196"/>
        <path d="M76 88C86 124 108 152 142 178"/>
        <path d="M20 30C44 28 66 20 84 4"/>
        <use href="#bloom" transform="translate(204 96) rotate(72)"/>
        <use href="#bloom" transform="translate(12 196) rotate(190) scale(.95)"/>
        <use href="#bud" transform="translate(142 178) rotate(128)"/>
        <use href="#bud" transform="translate(84 4) rotate(60) scale(.8)"/>
        <use href="#leaf" transform="translate(112 102) rotate(-20) scale(.9)"/>
        <use href="#leaf" transform="translate(58 78) rotate(90) scale(.85)"/>
        <use href="#leaf" transform="translate(30 104) rotate(160) scale(.7)"/>
        <use href="#leaf" transform="translate(98 122) rotate(10) scale(.65)"/>
      </g>
    </symbol>
  </svg>

  <div id="draft-banner" class="draft-banner" hidden>Preview. Tanggal dan lokasi masih sementara.</div>

  <section id="cover" class="cover" aria-label="Sampul undangan">
    <div class="cover-body framed">
      <svg class="floral floral-top" aria-hidden="true"><use href="#floral"/></svg>
      <svg class="floral floral-bottom" aria-hidden="true"><use href="#floral"/></svg>
      <h1 class="names">
        <span data-key="couple.bride.nickname"></span>
        <span class="names-amp">&amp;</span>
        <span data-key="couple.groom.nickname"></span>
      </h1>
      <p class="cover-info" id="cover-date"></p>
      <p class="cover-info" data-key="opening.place"></p>
      <div class="guest-card">
        <p>Kepada Yth</p>
        <p class="guest-name" id="guest-name">Bapak/Ibu/Saudara/i</p>
      </div>
      <button id="open-invitation" class="btn btn-gold" type="button">Buka Undangan</button>
      <p id="load-error" class="load-error" role="alert" hidden></p>
      <noscript><p class="load-error">Undangan ini membutuhkan JavaScript agar isinya dapat ditampilkan.</p></noscript>
    </div>
  </section>

  <div class="page">
    <main id="content" tabindex="-1">
      <section id="salam" class="section section-maroon framed">
        <svg class="floral floral-top" aria-hidden="true"><use href="#floral"/></svg>
        <p class="arabic arabic-lg" lang="ar" dir="rtl" data-key="opening.basmalah"></p>
        <p class="salam" data-key="opening.salam"></p>
        <p data-key="opening.intro"></p>
        <div class="divider" aria-hidden="true"></div>
        <p class="arabic" lang="ar" dir="rtl" data-key="opening.verse.arabic"></p>
        <p data-key="opening.verse.translation"></p>
        <p class="source" data-key="opening.verse.source"></p>
      </section>

      <section id="mempelai" class="section section-cream framed">
        <svg class="floral floral-bottom" aria-hidden="true"><use href="#floral"/></svg>
        <h2 class="script-title">Mempelai</h2>
        <p class="tagline" data-key="opening.tagline"></p>
        <p data-key="couple.intro"></p>
        <article class="person" data-person="bride"></article>
        <p class="couple-amp" aria-hidden="true">&amp;</p>
        <article class="person" data-person="groom"></article>
      </section>

      <section id="cerita" class="section section-maroon framed">
        <svg class="floral floral-top" aria-hidden="true"><use href="#floral"/></svg>
        <h2 class="script-title" data-key="story.title"></h2>
        <p data-key="story.intro"></p>
        <ol id="story" class="story"></ol>
        <p class="story-signature" data-key="story.signature"></p>
      </section>

      <section id="acara" class="section section-cream framed">
        <svg class="floral floral-top" aria-hidden="true"><use href="#floral"/></svg>
        <h2 class="script-title">Save the Date</h2>
        <div id="countdown" class="countdown" role="timer" aria-label="Hitung mundur menuju acara" hidden></div>
        <div id="events" class="stack"></div>
      </section>

      <section id="info" class="section section-maroon framed">
        <h2 class="script-title" data-key="guestInfo.title"></h2>
        <ul id="guest-info" class="info-list"></ul>
      </section>

      <section id="hadir" class="section section-cream framed">
        <svg class="floral floral-bottom" aria-hidden="true"><use href="#floral"/></svg>
        <h2 class="script-title">Konfirmasi Kehadiran</h2>
        <p data-key="rsvp.intro"></p>
        <form id="rsvp-form" class="form">
          <label for="rsvp-name">Nama</label>
          <input id="rsvp-name" name="name" type="text" maxlength="60" autocomplete="name" required>
          <fieldset>
            <legend>Kehadiran</legend>
            <label class="choice"><input type="radio" name="attend" value="Insya Allah hadir" required> Insya Allah hadir</label>
            <label class="choice"><input type="radio" name="attend" value="Mohon maaf, belum dapat hadir"> Mohon maaf, belum dapat hadir</label>
          </fieldset>
          <label for="rsvp-count">Jumlah orang</label>
          <input id="rsvp-count" name="count" type="number" min="1" max="10" value="1" inputmode="numeric">
          <label for="rsvp-message">Ucapan dan doa (opsional)</label>
          <textarea id="rsvp-message" name="message" rows="3" maxlength="300"></textarea>
          <button class="btn btn-maroon" type="submit">Kirim lewat WhatsApp</button>
          <p id="rsvp-note" class="form-note" role="status" hidden></p>
        </form>
      </section>

      <section id="hadiah" class="section section-maroon framed">
        <h2 class="script-title">Tanda Kasih</h2>
        <p data-key="gifts.intro"></p>
        <div id="gifts" class="stack"></div>
      </section>

      <section id="doa" class="section section-cream framed section-closing">
        <svg class="floral floral-top" aria-hidden="true"><use href="#floral"/></svg>
        <svg class="floral floral-bottom" aria-hidden="true"><use href="#floral"/></svg>
        <p class="arabic" lang="ar" dir="rtl" data-key="closing.prayer.arabic"></p>
        <p data-key="closing.prayer.translation"></p>
        <p class="source" data-key="closing.prayer.source"></p>
        <div class="divider" aria-hidden="true"></div>
        <p data-key="closing.thanks"></p>
        <p class="salam" data-key="closing.salam"></p>
        <p data-key="closing.signature"></p>
        <p class="names names-closing">
          <span data-key="couple.bride.nickname"></span>
          <span class="names-amp">&amp;</span>
          <span data-key="couple.groom.nickname"></span>
        </p>
        <p class="music-credit" data-key="music.credit"></p>
      </section>
    </main>

    <audio id="music" loop preload="none"></audio>
    <button id="music-toggle" class="music-toggle" type="button" aria-pressed="false" aria-label="Nyalakan musik" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="6.5" cy="18" r="2.5" fill="currentColor"/>
        <circle cx="16.5" cy="16" r="2.5" fill="currentColor"/>
        <path class="music-slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>

    <nav class="bottom-nav" aria-label="Navigasi undangan">
      <a href="#salam">Salam</a>
      <a href="#mempelai">Mempelai</a>
      <a href="#acara">Acara</a>
      <a href="#hadir">RSVP</a>
      <a href="#hadiah">Hadiah</a>
    </nav>
  </div>

  <template id="person-template">
    <div class="person-oval" aria-hidden="true"><span class="person-initial"></span></div>
    <p class="person-role"></p>
    <h3 class="person-name"></h3>
    <p class="person-parents"></p>
    <p class="person-origin" hidden></p>
  </template>

  <template id="event-template">
    <article class="card">
      <h3 class="event-name"></h3>
      <p class="event-note" hidden></p>
      <dl class="event-info">
        <dt>Tanggal</dt><dd class="event-date"></dd>
        <dt>Waktu</dt><dd class="event-time"></dd>
        <dt>Tempat</dt><dd class="event-venue"></dd>
        <dt class="event-address-label">Alamat</dt><dd class="event-address"></dd>
      </dl>
      <div class="btn-row">
        <a class="btn btn-maroon event-map" target="_blank" rel="noopener">Buka Peta</a>
        <a class="btn btn-outline event-calendar" target="_blank" rel="noopener">Simpan Tanggal</a>
      </div>
    </article>
  </template>

  <template id="gift-template">
    <article class="card card-gift">
      <p class="gift-bank"></p>
      <p class="gift-number"></p>
      <p class="gift-holder"></p>
      <button class="btn btn-maroon gift-copy" type="button">Salin Nomor</button>
    </article>
  </template>

  <script src="assets/js/app.js"></script>
</body>
</html>
